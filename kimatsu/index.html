<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>基礎歯科生理学 五択演習</title>
<style>
  :root{
    --paper:#FAF9F5;--ink:#1A1A1A;--sub:#6B6B63;
    --green:#1F5B3E;--green-mid:#4CA57A;--green-pale:#E4F0E8;
    --blue:#1B4B8F;--blue-pale:#E7EDF7;--red:#B23A2E;--red-pale:#F8E9E7;
    --rule:#D9D6CC;--card:#fff;--gray:#EEEDE8;
    --min:"Hiragino Mincho ProN","Yu Mincho","YuMincho","MS PMincho",serif;
    --go:"Hiragino Sans","Yu Gothic","YuGothic","Meiryo",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--go);-webkit-text-size-adjust:100%}
  .wrap{max-width:600px;margin:0 auto;padding:22px 20px 60px}
  .chap{background:var(--green);color:#fff;padding:30px 20px 26px}
  .chap.sm{padding:18px 20px 16px}
  .chap-in{max-width:600px;margin:0 auto;display:flex;align-items:baseline;gap:14px}
  .chap-t{font-family:var(--min);font-size:21px;letter-spacing:.1em;font-weight:600}
  .chap.sm .chap-t{font-size:17px}
  .chap-s{font-size:11px;letter-spacing:.18em;opacity:.82;margin-top:5px}
  .lead{font-family:var(--min);font-size:15px;line-height:1.9;color:var(--sub);margin:0 0 22px}
  .catbtn{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;
    background:var(--card);border:1px solid var(--green);border-radius:2px;padding:16px 18px;margin-bottom:11px;
    cursor:pointer;font-family:var(--go);font-size:16px;font-weight:600;color:var(--green)}
  .catbtn .meta{font-size:12px;color:var(--sub);font-weight:400}
  .catbtn .wrongdot{color:var(--red);font-weight:600;margin-left:8px}
  .btn{width:100%;padding:15px 18px;font-family:var(--go);font-size:15px;font-weight:600;letter-spacing:.03em;
    background:var(--card);color:var(--green);border:1px solid var(--green);border-radius:2px;cursor:pointer;margin-bottom:12px}
  .btn.p{background:var(--green);color:#fff}
  .btn.red{border-color:var(--red);color:var(--red)}
  .btn:disabled{opacity:.4;cursor:default}
  .chk{display:flex;align-items:center;gap:10px;margin:2px 2px 20px;font-size:14px;color:var(--sub);cursor:pointer}
  .chk input{width:16px;height:16px;accent-color:var(--green)}
  .bar{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--rule)}
  .bar-track{height:3px;background:var(--gray)}
  .bar-fill{height:100%;background:var(--green);width:0;transition:width .3s}
  .bar-in{max-width:600px;margin:0 auto;padding:9px 20px;display:flex;justify-content:space-between;font-size:12px;color:var(--sub);letter-spacing:.05em}
  .dia{color:var(--green-mid);margin:0 4px}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:13px}
  .tag{font-size:11px;letter-spacing:.06em;padding:3px 8px;font-weight:600;border:1px solid}
  .tag-cat{border-color:var(--green-mid);color:var(--green);background:var(--green-pale)}
  .tag-ok{border-color:var(--rule);color:var(--sub);background:var(--card)}
  .tag-guess{border-color:var(--red);color:var(--red);background:var(--red-pale)}
  h2.q{font-family:var(--min);font-size:18px;line-height:1.8;font-weight:600;margin:0 0 20px}
  .opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:var(--card);
    border:1px solid var(--rule);border-radius:2px;padding:13px 15px;margin-bottom:9px;
    font-family:var(--go);font-size:15px;line-height:1.6;color:var(--ink);cursor:pointer;transition:background .15s,border-color .15s}
  .opt:hover:not(:disabled){border-color:var(--green-mid)}
  .opt:disabled{cursor:default}
  .opt .L{font-family:var(--min);font-weight:600;min-width:14px;color:var(--sub)}
  .opt .T{flex:1}.opt .M{font-size:16px;font-weight:700}
  .opt.ok{background:var(--green-pale);border-color:var(--green-mid);color:var(--green)}
  .opt.ok .L{color:var(--green)}
  .opt.ng{background:var(--red-pale);border-color:var(--red);color:var(--red)}
  .opt.ng .L{color:var(--red)}
  .opt.dim{color:#9A9A92}
  .verdict{font-family:var(--min);font-size:17px;font-weight:600;margin:20px 0 14px}
  .verdict.y{color:var(--green)}.verdict.n{color:var(--red)}
  .col{background:var(--gray);padding:15px 16px;margin-top:20px}
  .col-h{display:flex;align-items:center;gap:8px;margin-bottom:11px}
  .col-chip{background:var(--green);color:#fff;font-size:11px;letter-spacing:.1em;padding:3px 10px;font-weight:600}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green-mid);display:inline-block}
  .col-b{font-family:var(--min);font-size:14.5px;line-height:1.9;color:#33332E}
  .col-b p{margin:0 0 9px}.col-b p:last-child{margin:0}
  .note{margin-top:11px;padding-top:11px;border-top:1px solid var(--rule);color:var(--blue)}
  .hint{font-size:13px;color:var(--sub);margin-top:16px;text-align:center}
  .score{text-align:center;padding:16px 0 24px}
  .score-n{font-family:var(--min);font-size:60px;line-height:1;color:var(--green);font-weight:600}
  .score-d{font-size:24px;color:var(--sub)}
  .score-p{font-size:13px;color:var(--sub);margin-top:9px;letter-spacing:.06em}
  .eyebrow{font-size:11px;letter-spacing:.15em;color:var(--sub);margin-bottom:11px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
  .wcard{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--red);padding:13px 15px;margin-bottom:9px}
  .wcard .n{font-size:11px;color:var(--sub);letter-spacing:.08em;margin-bottom:5px}
  .wcard .q{font-family:var(--min);font-size:14.5px;line-height:1.7;margin-bottom:7px}
  .wcard .a{font-size:14px;color:var(--green);font-weight:600}
  .foot{font-size:11px;color:var(--sub);text-align:center;margin-top:36px;line-height:1.8}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
// 全166問データ。cat: 小テスト/77期/78期/79期/予想
// o=選択肢, a=正解index, e=解説, w=注意(任意), src=答え出典 確|推
const DATA = [
/* ===== 小テスト 42問 ===== */
{cat:"小テスト",n:"9-1",src:"確",q:"アルカローシスの原因となるものはどれか。",o:["血中重炭酸イオン濃度の減少","分時換気量の減少","血中二酸化炭素分圧の減少","解剖学的シャントの存在","気道抵抗の増加"],a:2,e:"pHを主に決めるのはCO₂。CO₂が減る→酸が減る→アルカローシス。過換気で吐きすぎる＝呼吸性アルカローシス。b換気量減少は逆(CO₂貯留→アシドーシス)。"},
{cat:"小テスト",n:"9-2",src:"確",q:"低下によりヘモグロビン酸素解離曲線の右方移動を起こすのはどれか。",o:["O₂分圧","CO₂分圧","体温","2,3-DPG","pH値"],a:4,e:"右方移動＝末梢でO₂を離す。4点セット＝CO₂↑・pH↓・体温↑・2,3-DPG↑。「低下により右方移動」に当てはまるのはpH。他は上昇で右方移動。",w:"2,3-DPGは増加で右方移動(低下は左方)。方向をセットで。"},
{cat:"小テスト",n:"9-3",src:"確",q:"内呼吸が行われるのはどれか。",o:["上気道","動脈","気管支","肺胞","毛細血管"],a:4,e:"内呼吸＝組織の毛細血管と細胞の間。外呼吸＝肺胞と血液の間。外=肺/内=細胞でイメージ。"},
{cat:"小テスト",n:"9-4",src:"確",q:"呼息後さらに吐き出せる量はどれか。",o:["予備吸気量","最大吸気量","一回換気量","予備呼気量","機能的残気量"],a:3,e:"安静呼息位からさらに吐ける分＝予備呼気量(ERV)。肺活量＝予備吸気量＋一回換気量＋予備呼気量(残気量は含まない)。"},
{cat:"小テスト",n:"9-5",src:"確",q:"呼息筋はどれか。",o:["前鋸筋","内肋間筋","横隔膜","外肋間筋","胸鎖乳突筋"],a:1,e:"努力呼息＝内肋間筋・腹筋。安静呼息は受動的。吸息＝横隔膜・外肋間筋。"},
{cat:"小テスト",n:"9-6",src:"確",q:"大動脈小体を直接刺激するのはどれか。",o:["血中酸素分圧低下","血管壁伸展","血液pH上昇","舌咽神経興奮","血中二酸化炭素分圧低下"],a:0,e:"末梢化学受容器はO₂↓・CO₂↑・pH↓で刺激され呼吸促進。O₂低下を感知できるのは末梢だけ(中枢はCO₂・pHのみ)。"},
{cat:"小テスト",n:"9-7",src:"確",q:"正常時より呼吸頻度と深度が増加した状態はどれか。",o:["少呼吸","浅呼吸","多呼吸","徐呼吸","過呼吸"],a:2,e:"多呼吸＝両方増加／頻呼吸＝回数のみ／過呼吸＝深さのみ／徐呼吸＝回数減／少呼吸＝両方減。"},
{cat:"小テスト",n:"10-1",src:"確",q:"ステロイドなど脂溶性ホルモンが結合する受容体はどれか。",o:["細胞膜受容体","G蛋白共役型受容体","細胞内（核内）受容体","イオンチャネル型受容体","酵素共役型受容体"],a:2,e:"脂溶性＝膜を通過→細胞内(核内)受容体。水溶性＝細胞膜受容体。a・b・d・eは全部細胞膜受容体の仲間。"},
{cat:"小テスト",n:"10-2",src:"確",q:"体温を上げる（熱産生を増やす）反応はどれか。",o:["皮膚血管の拡張","発汗","ふるえ","不感蒸散","立毛筋の弛緩"],a:2,e:"ふるえ＝骨格筋の収縮で熱を生む。熱産生＝ふるえ・交感神経興奮。他は全部放熱。"},
{cat:"小テスト",n:"10-3",src:"確",q:"体温調節の中枢はどこにあるか。",o:["延髄","視床下部","大脳皮質","小脳","橋"],a:1,e:"視床下部＝体温・血糖・水分・摂食の調節中枢。延髄＝呼吸・循環・嚥下・嘔吐。"},
{cat:"小テスト",n:"10-4",src:"確",q:"発熱を引き起こす内因性発熱物質はどれか。",o:["エンドトキシン","プロスタグランジン","インスリン","アルドステロン","メラトニン"],a:1,e:"内因性＝体内で作られ設定温度を上げる＝プロスタグランジン。外因性＝エンドトキシン。アスピリンはPGを抑えて解熱。"},
{cat:"小テスト",n:"10-5",src:"確",q:"成人の安静時バイタルで異常を示すものはどれか。",o:["呼吸数 16回/分","脈拍 72回/分","血圧 120/80 mmHg","体温 38.5℃","SpO₂ 98%"],a:3,e:"正常：呼吸12〜20/脈拍60〜100/血圧120·80/体温36〜37/SpO₂96〜99。38.5℃は発熱＝異常。"},
{cat:"小テスト",n:"10-6",src:"確",q:"成長ホルモンの分泌を抑制するホルモンはどれか。",o:["ソマトスタチン","グルカゴン","サイロキシン","アドレナリン","インスリン"],a:0,e:"ソマトスタチン＝止める係。GH・インスリン・グルカゴンを抑制。GH促進＝GHRH。"},
{cat:"小テスト",n:"10-7",src:"確",q:"体温が最も高い部位はどこか。",o:["腋窩","口腔","鼓膜","直腸","皮膚表面"],a:3,e:"核心に近いほど高い＝直腸が最高。腋窩(体表)が最低。鼓膜は測定最速。"},
{cat:"小テスト",n:"11-1",src:"確",q:"低酸素状態で分泌が促進され赤血球産生を促すホルモンはどれか。",o:["サイロキシン","エリスロポエチン","アルドステロン","インスリン","カルシトニン"],a:1,e:"低酸素→腎臓がEPO分泌→骨髄で赤血球産生↑。腎臓は内分泌器官でもある。"},
{cat:"小テスト",n:"11-2",src:"確",q:"卵胞の発育を促すホルモンはどれか。",o:["プロゲステロン","エストロゲン","テストステロン","オキシトシン","プロラクチン"],a:1,e:"エストロゲン＝卵胞を発育・子宮内膜を増殖。プロゲステロン＝維持。上流の指令はFSH。"},
{cat:"小テスト",n:"11-3",src:"確",q:"寒冷ストレスを受けたとき分泌が増加するホルモンはどれか。",o:["インスリン","メラトニン","グルココルチコイド","カルシトニン","プロラクチン"],a:2,e:"どんなストレスでもコルチゾール(グルココルチコイド)が分泌。ストレス→CRH→ACTH→副腎皮質→コルチゾール。",w:"ストレス＝コルチゾール(インスリンではない。むしろ抑制)。"},
{cat:"小テスト",n:"11-4",src:"確",q:"抗炎症作用をもつホルモンはどれか。",o:["インスリン","コルチゾール","カルシトニン","オキシトシン","メラトニン"],a:1,e:"コルチゾール＝抗炎症・免疫抑制・血糖↑。ステロイド薬がこれ。ストレスホルモン・血糖↑・抗炎症の3点セット。"},
{cat:"小テスト",n:"11-5",src:"確",q:"甲状腺から分泌され代謝を促進するホルモンはどれか。",o:["パラトルモン","カルシトニン","サイロキシン","アルドステロン","ガストリン"],a:2,e:"サイロキシン(T4)＝代謝を促進。過剰＝バセドウ病。甲状腺：濾胞細胞＝サイロキシン/傍濾胞細胞＝カルシトニン。"},
{cat:"小テスト",n:"11-6",src:"確",q:"精子形成を促すホルモンはどれか。",o:["エストロゲン","プロゲステロン","テストステロン","プロラクチン","カルシトニン"],a:2,e:"テストステロン＝男性ホルモン。精巣の間質細胞(ライディッヒ細胞)が分泌。分泌＝ライディッヒ/支持＝セルトリ。"},
{cat:"小テスト",n:"11-7",src:"確",q:"血中Ca濃度が上昇したとき分泌されCa濃度を下げるホルモンはどれか。",o:["パラトルモン（PTH）","カルシトニン","サイロキシン","アルドステロン","インスリン"],a:1,e:"血中Ca↑→カルシトニン(甲状腺C細胞)→骨吸収抑制→Caを下げる。Ca↓→PTH(上げる)。",w:"条件(上昇/低下)と働き(下げる/上げる)を両方対応させる。"},
{cat:"小テスト",n:"11-8",src:"確",q:"血糖値が上昇したとき分泌され血糖を下げるホルモンはどれか。",o:["グルカゴン","インスリン","アドレナリン","コルチゾール","成長ホルモン"],a:1,e:"下げるのはインスリンだけ。上げるのはグルカゴン・アドレナリン・コルチゾール・GHの複数。"},
{cat:"小テスト",n:"11-9",src:"確",q:"血糖を下げる作用をもつホルモンはいくつあるか。",o:["1つ","2つ","3つ","4つ","5つ"],a:0,e:"血糖を下げるのはインスリンただ1つ。上げる係は複数。この非対称性を問う問題。"},
{cat:"小テスト",n:"12-1",src:"確",q:"消化管の運動を支配する神経叢はどれか。またそれはどこにあるか。",o:["マイスネル神経叢（粘膜下層）","アウエルバッハ神経叢（輪走筋層と縦走筋層の間）","マイスネル神経叢（輪走筋層と縦走筋層の間）","アウエルバッハ神経叢（粘膜下層）","アウエルバッハ神経叢（漿膜の外側）"],a:1,e:"アウエルバッハ＝筋層間＝運動。マイスネル＝粘膜下＝分泌。名前と位置を入れ替えるのが定番のひっかけ。"},
{cat:"小テスト",n:"12-2",src:"確",q:"デンプンを分解する消化酵素はどれか。",o:["ペプシン","リパーゼ","アミラーゼ","トリプシン","マルターゼ"],a:2,e:"アミラーゼ＝デンプン(糖質)。糖質＝アミラーゼ/脂質＝リパーゼ/タンパク＝ペプシン・トリプシン。"},
{cat:"小テスト",n:"12-3",src:"確",q:"膵臓から分泌されるタンパク質分解酵素の前駆体はどれか。",o:["ペプシノーゲン","トリプシノーゲン","アミラーゼ","リパーゼ","マルターゼ"],a:1,e:"トリプシノーゲン＝膵臓の不活性型。十二指腸でトリプシンに活性化。自己消化を防ぐ。膵臓＝トリプシノーゲン/胃＝ペプシノーゲン。"},
{cat:"小テスト",n:"12-4",src:"確",q:"脂質を分解する消化酵素はどれか。",o:["アミラーゼ","ペプシン","トリプシン","リパーゼ","マルターゼ"],a:3,e:"リパーゼ＝脂質。脂質は胆汁で乳化してからリパーゼが作用する(2段構え)。"},
{cat:"小テスト",n:"12-5",src:"確",q:"膵液の分泌を促進する消化管ホルモンはどれか。",o:["ガストリン","セクレチン","インスリン","アルドステロン","カルシトニン"],a:1,e:"セクレチン＝重炭酸に富む膵液を分泌・胃酸を抑制。ガストリン＝胃酸/CCK＝胆嚢収縮・膵酵素。"},
{cat:"小テスト",n:"12-6",src:"確",q:"輪走筋が断続的に収縮し内容物を混和する消化管運動はどれか。",o:["蠕動運動","分節運動","振り子運動","逆蠕動","集団運動"],a:1,e:"分節運動＝輪走筋の断続収縮で混和。混ぜる＝分節/振り子＝縦走筋/送る＝蠕動(スターリングの腸の法則)。"},
{cat:"小テスト",n:"13-1",src:"確",q:"アミラーゼがデンプンを分解してできる産物はどれか。",o:["グルコース","マルトース（麦芽糖）","ラクトース（乳糖）","スクロース（ショ糖）","ガラクトース"],a:1,e:"アミラーゼはマルトース(二糖)まで。グルコースはマルターゼが作る。消化は2段階。二糖：G+G=麦芽糖/G+ガラクトース=乳糖/G+果糖=ショ糖。",w:"アミラーゼの産物はマルトース(グルコースではない)。"},
{cat:"小テスト",n:"13-2",src:"確",q:"小腸の毛細血管から吸収されるものはどれか。",o:["トリグリセリド","コレステロール","グルコース","脂溶性ビタミン","カイロミクロン"],a:2,e:"毛細血管＝グルコース・アミノ酸(水溶性)。乳び管＝脂質・脂溶性ビタミン。c以外は脂の仲間。"},
{cat:"小テスト",n:"13-3",src:"確",q:"排便反射を引き起こす受容器はどれか。",o:["胃壁の化学受容器","直腸の伸展受容器","肛門の温度受容器","小腸の浸透圧受容器","大腸の圧受容器"],a:1,e:"便が直腸へ→伸展受容器→骨盤神経→腰髄・仙髄→直腸収縮＋内肛門括約筋弛緩。外肛門括約筋＝陰部神経・随意。"},
{cat:"小テスト",n:"13-4",src:"確",q:"胃が自己消化されるのを防いでいるものはどれか。",o:["塩酸","ペプシン","ムチン（粘液）","ガストリン","内因子"],a:2,e:"副細胞＝ムチン(守る)/壁細胞＝塩酸(攻める)/主細胞＝ペプシノーゲン(攻める)。防ぐ＝ムチン/起こす＝塩酸。"},
{cat:"小テスト",n:"14-1",src:"確",q:"特殊感覚に含まれるものはどれか。",o:["触覚","痛覚","平衡感覚","温度覚","深部感覚"],a:2,e:"特殊感覚5つ＝視・聴・平衡・味・嗅(専用器官が顔にある)。他は体性感覚。"},
{cat:"小テスト",n:"14-2",src:"確",q:"網膜で色を感知する細胞はどれか。",o:["杆体細胞","錐体細胞","双極細胞","神経節細胞","水平細胞"],a:1,e:"錐体＝色・明所・中心窩/杆体＝明暗・暗所。光を受けるのは錐体と杆体だけ。"},
{cat:"小テスト",n:"14-3",src:"確",q:"視軸とはどこを結ぶ線か。",o:["角膜中央と視神経乳頭","水晶体中央と中心窩","瞳孔と視神経乳頭","角膜中央と水晶体","網膜と視神経"],a:1,e:"視軸＝水晶体中央と中心窩。中心窩＝錐体密集・最も見える。視神経乳頭＝盲点。"},
{cat:"小テスト",n:"14-4",src:"確",q:"触覚の脊髄視床路における視床の主要な経由核はどれか。",o:["腹側基底核","内側毛様体","髄板内核","正中中心核","外側毛様体"],a:0,e:"触覚の主要な中継核＝視床後外側腹側核(腹側基底核VPL)。情動的側面なら髄板内核(78期はこちら)。",w:"限定語(触覚・主要な vs 情動)で腹側基底核/髄板内核が変わる。"},
{cat:"小テスト",n:"15-1",src:"確",q:"内臓の痛みが離れた皮膚の部位に感じられる現象はどれか。",o:["幻肢痛","関連痛","一次痛","神経障害性疼痛","灼熱痛"],a:1,e:"関連痛＝内臓の障害が離れた皮膚の痛みに。肝臓・胆嚢→右肩/心臓→左肩。機序＝脊髄後角での収束。"},
{cat:"小テスト",n:"15-2",src:"確",q:"直線加速度を受容する平衡器官はどれか。",o:["半規管","耳石器","蝸牛","鼓膜","耳管"],a:1,e:"耳石器＝直線加速度・重力。半規管＝回転加速度。耳石が重いので傾き・直線運動でズレて感覚毛を曲げる。"},
{cat:"小テスト",n:"15-3",src:"確",q:"脊髄後角においてC線維が入力する層はどれか。",o:["第IV層","第III層","第II層","第V/VI層","第I層"],a:2,e:"C線維(無髄・鈍痛)は脊髄後角の第I・II層(浅層)。第II層＝膠様質。細い線維は浅く、太い線維(Aβ触覚)は深層。",w:"大脳皮質の層ではなく脊髄後角のラミナ＝第II層。"},
{cat:"小テスト",n:"15-4",src:"確",q:"鋭痛に主に関与するとされるのはどれか。",o:["Aδ","Aα","Aβ","Aγ","C"],a:0,e:"一次痛(鋭い・速い)＝Aδ(有髄)/二次痛(鈍い・遅い)＝C(無髄)。ピキッ(Aδ)→ジーン(C)。"},
{cat:"小テスト",n:"15-5",src:"確",q:"音の強度（大きさ）を決定するのはどれか。",o:["速度","周波数","振幅","波形","周期"],a:2,e:"大きさ＝振幅(振れ幅)/高さ＝周波数/音色＝波形。音速≒340m/s。"},

{cat:"77期",n:"2",src:"推",q:"ペプシノーゲンの分泌を促進するホルモンはどれか。",o:["コレシストキニン","ガストリン","セクレチン","インスリン","ソマトスタチン"],a:1,e:"ガストリン(胃G細胞)＝胃酸＋ペプシノーゲンを促進。CCK＝胆嚢収縮/セクレチン＝膵液。",w:"選択肢3〜5はClaudeが補完。"},
{cat:"77期",n:"3",src:"推",q:"体温調節中枢が存在するのはどこか。",o:["視床下部","延髄","大脳皮質","脊髄","橋"],a:0,e:"視床下部＝体温・血糖・水分・摂食。延髄＝呼吸・循環・嚥下・嘔吐。"},
{cat:"77期",n:"4",src:"推",q:"有毛細胞が存在するのはどれか。",o:["耳石器","鼓膜","コルチ器","外耳道","耳管"],a:2,e:"聴覚＝コルチ器の有毛細胞。平衡覚＝耳石器・膨大部稜。鼓膜・外耳道・耳管には無い。",w:"耳石器にも有毛細胞はある。問題文が聴覚か平衡覚かで答えが変わる。"},
{cat:"77期",n:"5",src:"確",q:"呼吸による熱放散の様式はどれか。",o:["放射","伝導","蒸発","対流","輻射"],a:2,e:"熱放散4様式＝放射・伝導・対流・蒸発。呼気の水蒸気が蒸発時に気化熱を奪う。"},
{cat:"77期",n:"6",src:"確",q:"成人の安静時における異常値はどれか。",o:["体温 36〜37度","SpO₂ 90〜95％","分時呼吸数 12〜20回","血圧 120/80 mmHg","脈拍 60〜100回/分"],a:1,e:"SpO₂正常は96〜99%。90〜95%は異常。他4つは正常値ど真ん中。"},
{cat:"77期",n:"7",src:"確",q:"インスリンが抑制するものはどれか。",o:["タンパク質合成","脂肪の合成","糖新生","グリコーゲンの合成","アミノ酸の取り込み"],a:2,e:"インスリン＝しまい込む係→合成・取り込みは促進。血糖を上げる糖新生だけ抑制。"},
{cat:"77期",n:"8",src:"確",q:"甲状腺機能低下により起こるものはどれか。",o:["体温上昇","心拍数増加","血糖値上昇","体重減少","硬組織の成長遅延"],a:4,e:"甲状腺ホルモン＝代謝促進。低下→体温↓・心拍↓・体重増・成長遅延。1〜4は亢進症の症状。歯・骨の成長遅延・萌出遅延。"},
{cat:"77期",n:"9",src:"確",q:"頸動脈小体を活性化するのはどれか。",o:["Naイオンの増加","Clイオンの増加","プロトンイオンの増加","CO₂分圧の低下","O₂分圧の増加"],a:2,e:"末梢化学受容器はO₂↓・CO₂↑・pH↓で刺激。プロトン(H⁺)増加＝pH低下。4・5は方向が逆。"},
{cat:"77期",n:"10",src:"確",q:"前立腺の成長を促進するホルモンはどれか。",o:["エストロゲン","テストステロン","プロゲステロン","アンドロゲン","カテコラミン"],a:1,e:"テストステロン＝精巣の間質細胞(ライディッヒ)が分泌。前立腺内でDHTに変換。",w:"アンドロゲン(総称)も広義には正解になりうる。具体名を選ぶのが定石。"},
{cat:"77期",n:"11",src:"確",q:"血中Ca濃度を調節するホルモンを産生する細胞はどれか。",o:["糸球体傍細胞","松果体細胞","副腎髄質細胞","濾胞傍細胞","膵島B細胞"],a:3,e:"甲状腺の濾胞傍細胞(C細胞)＝カルシトニン→Caを下げる。対は副甲状腺主細胞＝PTH→上げる。"},
{cat:"77期",n:"12",src:"確",q:"舌リパーゼが分解するものはどれか。",o:["セルロース","タンパク質","トリグリセリド","ジペプチド","コレステロール"],a:2,e:"リパーゼ＝脂質(トリグリセリド)。舌リパーゼは舌根のエブネル腺から。唾液アミラーゼ＝デンプン/舌リパーゼ＝脂質。"},
{cat:"77期",n:"13",src:"確",q:"黄斑はどこにあるか。",o:["角膜","網膜","水晶体","脈絡膜","強膜"],a:1,e:"黄斑＝網膜の中央部、その中心が中心窩(錐体密集・視力最高)。視神経乳頭＝盲点。"},
{cat:"77期",n:"14",src:"推",q:"トリグリセリドが分解されて生じるものはどれか。",o:["グリセロールとアミノ酸","モノグリセリドと脂肪酸","グルコースとガラクトース","ペプチドと脂肪酸","コレステロールと胆汁酸"],a:1,e:"膵リパーゼで分解→モノグリセリド＋脂肪酸。胆汁酸とミセルを作り吸収→カイロミクロン→乳び管。",w:"選択肢はClaudeが補完(原文は記述だった可能性)。"},
{cat:"77期",n:"15",src:"確",q:"内因性発熱物質はどれか。",o:["インターフェロン","アセチルコリン","カルモジュリン","ホスホリパーゼ","インスリン"],a:0,e:"内因性＝サイトカイン(インターフェロン等)・プロスタグランジン。外因性＝エンドトキシン。",w:"79期・小テストはプロスタグランジンが答え。選択肢で変わる。"},
{cat:"77期",n:"16",src:"推",q:"TRPV1が活性化すると生じるのはどれか。",o:["冷感","熱感・痛み","触圧覚","味覚","振動覚"],a:1,e:"TRPV1＝熱(43℃以上)・カプサイシン・酸で活性化→痛み・熱感。対：TRPM8・TRPA1＝冷。",w:"選択肢はClaudeが補完。"},
{cat:"77期",n:"17",src:"確",q:"胆汁色素はどれか。",o:["リトコール酸","エリスロポエチン","コール酸","ビリルビン","コレステロール"],a:3,e:"胆汁色素＝ビリルビン(便の色・溜まると黄疸)。胆汁酸＝コール酸・リトコール酸(乳化・腸肝循環)。酸は回収、色素は排泄。"},
{cat:"77期",n:"18",src:"確",q:"アルカローシスを生じるのはどれか。",o:["下痢","発汗","腎不全","過換気症候群","窒息"],a:3,e:"過換気→CO₂↓→呼吸性アルカローシス。窒息＝呼吸性アシドーシス/下痢・腎不全＝代謝性アシドーシス。嘔吐＝代謝性アルカローシス。"},
{cat:"77期",n:"19",src:"確",q:"カテコラミンはどれか。",o:["アドレナリン","セロトニン","アセチルコリン","ヒスタミン","GABA"],a:0,e:"カテコラミン＝アドレナリン・ノルアドレナリン・ドパミンの3つ。副腎髄質から分泌。",w:"選択肢はClaudeが補完(原文は答えのみ)。"},
{cat:"77期",n:"20",src:"確",q:"赤血球の産生を促進するホルモンはどれか。",o:["エリスロポエチン","トロンボポエチン","カルシトニン","アルドステロン","サイロキシン"],a:0,e:"腎臓が低酸素を感知して分泌→赤血球産生↑。トロンボポエチン＝血小板(肝臓)。",w:"選択肢はClaudeが補完(原文は答えのみ)。"},
{cat:"77期",n:"21",src:"確",q:"手指皮膚の触刺激による上行性伝導路はどれか。",o:["後根神経節→脊髄後索核→視床後外側腹側核","後根神経節→脊髄後索核→視床後内側腹側核","後根神経節→脊髄後角→視床後外側腹側核","後根神経節→三叉神経脊髄路核→視床後内側腹側核","後根神経節→脊髄後角→視床髄板内核"],a:0,e:"触覚＝後索-内側毛帯路。後根神経節→脊髄後索→延髄後索核→延髄で交叉→VPL→一次体性感覚野。VPL＝四肢・体幹/VPM＝顔面。",w:"選択肢2以降はClaudeが補完。"},
{cat:"77期",n:"22",src:"確",q:"排便反射について正しいものを選べ。",o:["直腸の蠕動が促進される","反射中枢は頸髄にある","骨盤神経を介して外肛門括約筋が収縮する","陰部神経を介して内肛門括約筋が弛緩する","内肛門括約筋は骨格筋である"],a:0,e:"便が直腸へ→伸展受容器→骨盤神経→腰髄・仙髄→蠕動↑＋内肛門括約筋弛緩。内＝骨盤神経・平滑筋/外＝陰部神経・骨格筋。"},
{cat:"77期",n:"23",src:"確",q:"温度刺激の受容器はどれか。",o:["自由神経終末","Meissner小体","Krause小体","Ruffini小体","Pacinian小体"],a:0,e:"温度覚・痛覚＝自由神経終末(TRPチャネル)。他は被膜をもつ機械受容器。",w:"Krause小体は古典的に冷覚とされたが現在は機械受容器。自由神経終末があればそちら。"},
{cat:"77期",n:"24",src:"確",q:"Meissner神経叢の存在位置はどこか。",o:["粘膜下層","輪走筋層と縦走筋層の間","漿膜の外側","粘膜上皮内","筋層の外側"],a:0,e:"Meissner＝粘膜下神経叢＝粘膜下層＝分泌。Auerbach＝筋層間＝運動。",w:"選択肢2以降はClaudeが補完。"},
{cat:"77期",n:"25",src:"確",q:"明暗を直接受容する網膜の細胞はどれか。",o:["錐体","杆体","双極細胞","水平細胞","神経節細胞"],a:1,e:"光を受ける視細胞は錐体と杆体だけ。錐体＝色・明所/杆体＝明暗・暗所。"},
{cat:"77期",n:"26",src:"推",q:"ペプチド型ホルモンの受容体はどれか。",o:["細胞膜受容体","細胞内（核内）受容体","細胞質受容体","ミトコンドリア受容体","リボソーム受容体"],a:0,e:"ペプチド＝水溶性→細胞膜受容体。ステロイド・甲状腺ホルモン＝脂溶性→細胞内受容体。",w:"選択肢はClaudeが補完。"},
{cat:"77期",n:"27",src:"推",q:"胃内壁の自己消化を防いでいるのはどれか。",o:["ムチン（粘液）","塩酸","ペプシン","ガストリン","内因子"],a:0,e:"副細胞＝ムチン(守る)/壁細胞＝塩酸/主細胞＝ペプシノーゲン。防ぐ/起こすの両方向で。",w:"原文は「原因は」＝塩酸を答えさせる形だった可能性。両方向で答えられるように。"},
{cat:"77期",n:"29",src:"推",q:"非ふるえ熱産生に関与する細胞はどれか。",o:["褐色脂肪細胞","白色脂肪細胞","骨格筋細胞","肥満細胞","マクロファージ"],a:0,e:"ふるえ＝骨格筋/非ふるえ＝褐色脂肪細胞(UCP1でATPを作らず熱に)。新生児で発達。",w:"選択肢はClaudeが補完(原文は答えのみ)。"},
{cat:"77期",n:"30",src:"推",q:"高齢女性の骨粗鬆症の主な原因はどれか。",o:["エストロゲンの低下","テストステロンの低下","カルシトニンの増加","インスリンの低下","サイロキシンの低下"],a:0,e:"エストロゲンは破骨細胞を抑制。閉経で激減→骨吸収↑→骨粗鬆症。顎骨・歯槽骨の吸収。",w:"選択肢はClaudeが補完(原文は答えのみ)。"},
{cat:"77期",n:"31",src:"確",q:"吸息時に起こることについて正しいものを選べ。",o:["肋骨の挙上","横隔膜の弛緩","胸腔内圧の上昇","内肋間筋の収縮","胸郭容積の減少"],a:0,e:"吸息＝外肋間筋収縮→肋骨挙上、横隔膜収縮→下降、容積増大→陰圧↑→肺拡張。2〜5は呼息の記述。",w:"選択肢3以降はClaudeが補完。"},
{cat:"77期",n:"32",src:"確",q:"正常時より呼吸頻度と深度が減少した状態はどれか。",o:["少呼吸","浅呼吸","多呼吸","徐呼吸","過呼吸"],a:0,e:"多↔少(両方変わる)/頻↔徐(回数だけ)/過↔減(深さだけ)。ともに減少＝少呼吸。徐呼吸は回数だけ減。小9-Q7の裏返し。"},
{cat:"77期",n:"33",src:"推",q:"肺活量を表す式はどれか。",o:["予備吸気量＋一回換気量＋予備呼気量","一回換気量＋予備呼気量＋残気量","予備吸気量＋一回換気量＋残気量","機能的残気量＋予備吸気量","全肺気量＋残気量"],a:0,e:"肺活量＝IRV＋TV＋ERV(残気量を含まない)。全肺気量＝VC＋RV。残気量は吐き出せない＝最頻出ひっかけ。",w:"選択肢はClaudeが補完。"},
{cat:"77期",n:"34",src:"推",q:"小腸で再吸収されるものはどれか。",o:["胆汁酸","ペプシン","ムチン","サーファクタント","エンテロキナーゼ"],a:0,e:"胆汁酸は回腸で約95%再吸収→門脈→肝臓＝腸肝循環。ビリルビンは排泄。酸は回収、色素は排泄。",w:"選択肢はClaudeが補完。"},

/* ==== 間違い記録（localStorage・失敗しても動く） ==== */
var WKEY="shika_wrong_v1";
function loadWrong(){ try{var s=localStorage.getItem(WKEY);return s?JSON.parse(s):{};}catch(e){return {};} }
function saveWrong(w){ try{localStorage.setItem(WKEY,JSON.stringify(w));}catch(e){} }
var wrong=loadWrong();
function keyOf(q){return q.cat+"/"+q.n;}

var CATS=["小テスト","77期","78期","79期","予想"];
var L=["a","b","c","d","e"];
var app=document.getElementById("app");
var order=[],idx=0,picked=null,log={},shuffle=false,curCat="";

function esc(s){return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function dots(){return [1,.7,.45,.25].map(function(o){return '<span class="dot" style="opacity:'+o+'"></span>';}).join("");}
function chap(sm){return '<div class="chap'+(sm?" sm":"")+'"><div class="chap-in"><div class="chap-t">基礎歯科生理学</div><div><div class="chap-s">五 択 演 習</div></div></div></div>';}
function wrongCount(cat){var n=0;DATA.forEach(function(q){if(q.cat===cat&&wrong[keyOf(q)])n++;});return n;}
function totalWrong(){return Object.keys(wrong).filter(function(k){return wrong[k];}).length;}

function title(){
  var tw=totalWrong();
  var catButtons=CATS.map(function(c){
    var total=DATA.filter(function(q){return q.cat===c;}).length;
    var wc=wrongCount(c);
    return '<button class="catbtn" data-cat="'+c+'">'+
      '<span>'+c+'</span>'+
      '<span class="meta">'+total+'問'+(wc?'<span class="wrongdot">✕'+wc+'</span>':'')+'</span></button>';
  }).join("");
  app.innerHTML=chap()+'<div class="wrap">'+
    '<p class="lead">カテゴリを選んで五択で演習します。間違えた問題は自動で記録され、あとで「間違いだけ」やり直せます。</p>'+
    catButtons+
    '<button class="catbtn" data-cat="__ALL__" style="border-color:var(--green-mid)"><span>ぜんぶ通し</span><span class="meta">'+DATA.length+'問</span></button>'+
    (tw? '<button class="btn red" id="wrongAll" style="margin-top:14px">間違えた '+tw+' 問だけ解く（全カテゴリ）</button>'+
         '<button class="btn" id="clearWrong">間違いの記録を消す</button>' : '')+
    '<label class="chk" style="margin-top:18px"><input type="checkbox" id="sh" '+(shuffle?"checked":"")+'>順番をシャッフルする</label>'+
    '<div class="col"><div class="col-h"><span class="col-chip">つかいかた</span>'+dots()+'</div><div class="col-b">'+
    '<p>選択肢をタップ→その場で正誤と解説。最後に正答率と間違い一覧が出ます。</p>'+
    '<p>「答えは推定」の赤バッジは、過去問の再現で答えが確実でない問題。最終的な根拠は講義・教科書に置いてください。</p>'+
    '</div></div>'+
    '<p class="foot">基礎歯科生理学 期末対策（小テスト＋77・78・79期＋予想）<br>個人利用向け。答えの正確さは各自で確認してください。</p>'+
    '</div>';
  document.getElementById("sh").onchange=function(e){shuffle=e.target.checked;};
  Array.prototype.forEach.call(document.querySelectorAll(".catbtn"),function(b){
    b.onclick=function(){
      var c=b.dataset.cat;
      var list = c==="__ALL__" ? DATA.slice() : DATA.filter(function(q){return q.cat===c;});
      curCat = c==="__ALL__" ? "ぜんぶ通し" : c;
      start(list);
    };
  });
  var wa=document.getElementById("wrongAll");
  if(wa) wa.onclick=function(){
    var list=DATA.filter(function(q){return wrong[keyOf(q)];});
    curCat="間違い復習"; start(list);
  };
  var cw=document.getElementById("clearWrong");
  if(cw) cw.onclick=function(){ if(confirm("間違いの記録を全部消しますか？")){wrong={};saveWrong(wrong);title();} };
}

function start(list){
  order=list.slice();
  if(shuffle) for(var i=order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=order[i];order[i]=order[j];order[j]=t;}
  idx=0;picked=null;log={};quiz();
}

function quiz(){
  var q=order[idx],done=picked!==null;
  var pct=((idx+(done?1:0))/order.length)*100;
  var tagCat='<span class="tag tag-cat">'+esc(q.cat)+' '+esc(q.n)+'</span>';
  var tagSrc = q.src==="確" ? '<span class="tag tag-ok">答えは確定</span>' : '<span class="tag tag-guess">答えは推定</span>';
  app.innerHTML='<div class="bar"><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div>'+
    '<div class="bar-in"><span>'+esc(curCat)+'</span><span style="font-family:var(--min)">'+(idx+1)+' <span class="dia">◆</span> '+order.length+'</span></div></div>'+
    '<div class="wrap"><div class="tags">'+tagCat+tagSrc+'</div><h2 class="q">'+esc(q.q)+'</h2><div id="opts">'+
    q.o.map(function(t,i){
      var cls="opt",mark="";
      if(done&&i===q.a){cls+=" ok";mark='<span class="M">✓</span>';}
      else if(done&&i===picked){cls+=" ng";mark='<span class="M">✕</span>';}
      else if(done){cls+=" dim";}
      return '<button class="'+cls+'" data-i="'+i+'" '+(done?"disabled":"")+'><span class="L">'+L[i]+'.</span><span class="T">'+esc(t)+'</span>'+mark+'</button>';
    }).join("")+'</div>'+
    (done ? (
      '<div class="verdict '+(picked===q.a?"y":"n")+'">'+(picked===q.a?"正解":"不正解 ── 正解は "+L[q.a]+". "+esc(q.o[q.a]))+'</div>'+
      '<div class="col"><div class="col-h"><span class="col-chip">解説</span>'+dots()+'</div><div class="col-b"><p>'+esc(q.e)+'</p>'+
      (q.w?'<p class="note"><b>注意</b>　'+esc(q.w)+'</p>':'')+'</div></div>'+
      '<div style="margin-top:20px"><button class="btn p" id="next">'+(idx+1<order.length?"次の問題へ":"結果を見る")+'</button></div>'
    ) : '<p class="hint">選択肢をタップすると解説が出ます</p>')+
    '</div>';
  if(!done){
    Array.prototype.forEach.call(document.querySelectorAll(".opt"),function(b){
      b.onclick=function(){
        picked=+b.dataset.i; var correct=picked===q.a; log[keyOf(q)]=correct;
        if(correct){ if(wrong[keyOf(q)]){delete wrong[keyOf(q)];saveWrong(wrong);} }
        else { wrong[keyOf(q)]=true; saveWrong(wrong); }
        quiz(); window.scrollTo(0,0);
      };
    });
  } else {
    document.getElementById("next").onclick=function(){
      if(idx+1<order.length){idx++;picked=null;quiz();window.scrollTo(0,0);}
      else result();
    };
  }
}

function result(){
  var wrongs=order.filter(function(q){return log[keyOf(q)]===false;});
  var ok=order.length-wrongs.length;
  var pct=Math.round(ok/order.length*100);
  app.innerHTML=chap(true)+'<div class="wrap">'+
    '<div class="score"><div class="score-n">'+ok+'<span class="score-d"> / '+order.length+'</span></div><div class="score-p">正答率 '+pct+'%</div></div>'+
    (wrongs.length===0
      ? '<p style="font-family:var(--min);font-size:16px;text-align:center;color:var(--green);margin:0 0 26px">全問正解。まちがいはありません。</p>'
      : '<div style="margin-bottom:26px"><div class="eyebrow">このセットで間違えた問題</div>'+
        wrongs.map(function(q){return '<div class="wcard"><div class="n">'+esc(q.cat)+' '+esc(q.n)+'</div><div class="q">'+esc(q.q)+'</div><div class="a">正解：'+esc(q.o[q.a])+'</div></div>';}).join("")+'</div>'+
        '<button class="btn red" id="retry">間違えた '+wrongs.length+' 問をやり直す</button>')+
    '<button class="btn" id="home">最初の画面へ</button></div>';
  if(wrongs.length){document.getElementById("retry").onclick=function(){start(wrongs);};}
  document.getElementById("home").onclick=title;
}

/* ==== 合言葉（クラス内向けの軽い鍵。ソースを見れば分かる程度の保護） ==== */
var PW="nantokanaru", AUTHKEY="shika_auth_v1";
function authed(){ try{return localStorage.getItem(AUTHKEY)==="1";}catch(e){return false;} }
function boot(){ if(authed()){ title(); } else { gate(); } }
function gate(){
  app.innerHTML=chap()+'<div class="wrap">'+
    '<p class="lead">このアプリは合言葉が必要です。クラスで共有された合言葉を入れてください。</p>'+
    '<input id="pw" type="password" autocomplete="off" placeholder="合言葉" style="width:100%;padding:14px 15px;font-size:16px;font-family:var(--go);border:1px solid var(--rule);border-radius:2px;margin-bottom:12px;background:#fff;color:var(--ink)">'+
    '<button class="btn p" id="pwgo">入る</button>'+
    '<p id="pwerr" style="color:var(--red);font-size:13px;margin-top:10px;display:none">合言葉がちがいます</p>'+
    '</div>';
  var go=function(){
    var v=document.getElementById("pw").value.trim();
    if(v===PW){ try{localStorage.setItem(AUTHKEY,"1");}catch(e){} title(); }
    else { document.getElementById("pwerr").style.display="block"; }
  };
  document.getElementById("pwgo").onclick=go;
  document.getElementById("pw").addEventListener("keydown",function(ev){ if(ev.key==="Enter") go(); });
}
boot();
</script>
